<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trilha da Aprovação - TJDFT</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 75%);
      color: var(--text);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .panel {
      background: rgba(19, 27, 46, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    .progress-bar {
      background: #1e293b;
      height: 16px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #06b6d4, #6366f1, #10b981);
      height: 100%;
      width: 0%;
      transition: width 0.35s ease;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }

    .btn-save { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-load { background: #334155; }
    .btn-reset { background: #dc2626; }

    .board-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
      margin-bottom: 50px;
    }

    .tile {
      border-radius: 14px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
      position: relative;
      border: 2px solid var(--theme-border, #334155);
      background-color: var(--theme-bg, #131b2e);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }

    .tile:active {
      transform: scale(0.92);
    }

    .tile-icon {
      font-size: 1.4rem;
      margin-bottom: 2px;
    }

    .tile-number {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
    }

    .tile-tag {
      font-size: 0.55rem;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    /* Temas de Cores */
    .cat-pt { --theme-border: #f97316; --theme-bg: rgba(249, 115, 22, 0.18); }
    .cat-leg { --theme-border: #eab308; --theme-bg: rgba(234, 179, 8, 0.18); }
    .cat-const { --theme-border: #06b6d4; --theme-bg: rgba(6, 182, 212, 0.18); }
    .cat-adm { --theme-border: #a855f7; --theme-bg: rgba(168, 85, 247, 0.18); }
    .cat-civ { --theme-border: #10b981; --theme-bg: rgba(16, 185, 129, 0.18); }
    .cat-proc-civ { --theme-border: #6366f1; --theme-bg: rgba(99, 102, 241, 0.18); }
    .cat-pen { --theme-border: #ef4444; --theme-bg: rgba(239, 68, 68, 0.18); }
    .cat-proc-pen { --theme-border: #f43f5e; --theme-bg: rgba(244, 63, 94, 0.18); }
    .cat-star { --theme-border: #ffd700; --theme-bg: rgba(255, 215, 0, 0.25); box-shadow: 0 0 12px rgba(255,215,0,0.5); }

    .tile.concluido {
      background: linear-gradient(135deg, rgba(16,185,129,0.4), rgba(5,150,105,0.55)) !important;
      border-color: #10b981 !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.7) !important;
    }

    .tile.concluido::after {
      content: "✓";
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 0.75rem;
      font-weight: 900;
      color: #34d399;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-header-icon { font-size: 2.2rem; }

    .modal-topic {
      font-size: 0.82rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid #38bdf8;
    }

    .quiz-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .quiz-prompt {
      font-size: 0.92rem;
      line-height: 1.45;
      color: #f1f5f9;
      font-weight: 500;
      min-height: 65px;
      white-space: pre-line;
    }

    .quiz-options {
      display: flex;
      gap: 10px;
    }

    .btn-opt {
      flex: 1;
      padding: 11px;
      font-size: 0.85rem;
      font-weight: 800;
      border: 2px solid transparent;
      border-radius: 8px;
    }

    .btn-opt-certo { background: #1e3a8a; }
    .btn-opt-errado { background: #831843; }

    .btn-correct { background: #10b981 !important; border-color: #34d399 !important; }
    .btn-incorrect { background: #ef4444 !important; border-color: #f87171 !important; }

    .quiz-feedback {
      display: none;
      font-size: 0.83rem;
      padding: 10px;
      border-radius: 8px;
      line-height: 1.4;
    }

    .quiz-feedback.show { display: block; }
    .quiz-feedback.success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #a7f3d0; }
    .quiz-feedback.danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fecaca; }

    .nav-btn {
      background: #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
  </style>
</head>

      { id: 76, c: "cat-proc-civ", i: "📚", d: "Processo Civil", t: "Precedentes obrigatórios, IRDR, IAC, Reclamação e Ação Rescisória" },
      { id: 77, c: "cat-proc-civ", i: "📜", d: "Processo Civil", t: "Processo de Execução, títulos executivos e Cumprimento de Sentença" },

      { id: 78, c: "cat-star", i: "⭐", d: "Revisão", t: "CHECKPOINT 5: Bateria Extensiva de Processo Civil" },

      { id: 79, c: "cat-pen", i: "⚖️", d: "Direito Penal", t: "Princípios penais e aplicação da lei penal no tempo e no espaço" },
      { id: 80, c: "cat-pen", i: "🎯", d: "Direito Penal", t: "Teoria do Crime: conduta, resultado, tipicidade, dolo, culpa e tentativa" },
      { id: 81, c: "cat-pen", i: "🧠", d: "Direito Penal", t: "Excludentes de ilicitude, culpabilidade e Teoria do Erro" },
      { id: 82, c: "cat-pen", i: "⛓️", d: "Direito Penal", t: "Concurso de pessoas, Teoria das Penas, dosimetria e regimes prisionais" },
      { id: 83, c: "cat-pen", i: "🛑", d: "Direito Penal", t: "Extinção da punibilidade, crimes contra a pessoa e contra o patrimônio" },
      { id: 84, c: "cat-pen", i: "🚨", d: "Direito Penal", t: "Crimes contra a dignidade sexual, fé pública e segurança pública" },
      { id: 85, c: "cat-pen", i: "🏛️", d: "Direito Penal", t: "Crimes contra a Administração Pública praticados por funcionários e particulares" },
      { id: 86, c: "cat-pen", i: "👮", d: "Leis Penais", t: "Lei de Abuso de Autoridade (13.869/2019) e Lei Antidrogas (11.343/2006)" },
      { id: 87, c: "cat-pen", i: "🛡️", d: "Leis Penais", t: "Violência Doméstica / Maria da Penha (11.340) e Crimes Hediondos (8.072)" },
      { id: 88, c: "cat-pen", i: "💼", d: "Leis Penais", t: "Organizações Criminosas (12.850), Lavagem de Capitais e Desarmamento" },

      { id: 89, c: "cat-proc-pen", i: "🔍", d: "Processo Penal", t: "Princípios processuais penais e Inquérito Policial / Persecução" },
      { id: 90, c: "cat-proc-pen", i: "⚖️", d: "Processo Penal", t: "Ação penal pública/privada, sujeitos do processo e competência criminal" },
      { id: 91, c: "cat-proc-pen", i: "🔬", d: "Processo Penal", t: "Cadeia de custódia da prova pericial e interceptação telefônica" },
      { id: 92, c: "cat-proc-pen", i: "🔒", d: "Processo Penal", t: "Prisões cautelares (flagrante, temporária, preventiva) e liberdade provisória" },
      { id: 93, c: "cat-proc-pen", i: "📑", d: "Processo Penal", t: "Procedimento comum: rito ordinário e sumário no CPP" },
      { id: 94, c: "cat-proc-pen", i: "👥", d: "Processo Penal", t: "Procedimento especial do Tribunal do Júri (duas fases)" },
      { id: 95, c: "cat-proc-pen", i: "📤", d: "Processo Penal", t: "Nulidades processuais penais e recursos (Apelação, RESE, Carta)" },
      { id: 96, c: "cat-proc-pen", i: "🕊️", d: "Processo Penal", t: "Ações autônomas de impugnação: Habeas Corpus e Revisão Criminal" },
      { id: 97, c: "cat-proc-pen", i: "🏛️", d: "Processo Penal", t: "Juizados Especiais Criminais (Lei 9.099/1995) e Execução Penal (LEP)" },

      { id: 98, c: "cat-star", i: "⭐", d: "Revisão", t: "CHECKPOINT 6: Simulado Penal + Processo Penal Integrados" },
      { id: 99, c: "cat-star", i: "💎", d: "Jurisprudência", t: "CASA DA SÚMULA: Revisão Geral STF / STJ e Súmulas Vinculantes" },
      { id: 100, c: "cat-star", i: "👑", d: "Nomeação", t: "CASA DA POSSE: Grande Simulado Final Cooperativo!" }
    ];

    boardData.forEach(item => {
      const qList = [];
      for (let qNum = 1; qNum <= 10; qNum++) {
        qList.push({
          q: `Item ${qNum}: Conteúdo de ${item.d} relativo ao tópico "${item.t}". Aguardando o cadastro das questões oficiais no arquivo da casa.`,
          a: "C",
          exp: `Gabarito provisório da questão ${qNum} para a Casa ${item.id}.`
        });
      }
      item.questions = qList;
      item.loaded = false;
    });

    let concluidas = JSON.parse(localStorage.getItem("trilha_tjdft_done") || "[]");
    let currentTile = null;
    let currentQIndex = 0;
    let userAnswers = {};

    const board = document.getElementById("board");
    const modal = document.getElementById("modal");
    const modalNum = document.getElementById("modalNum");
    const modalDisc = document.getElementById("modalDisc");
    const modalIcon = document.getElementById("modalIcon");
    const modalTopic = document.getElementById("modalTopic");
    const quizCounter = document.getElementById("quizCounter");
    const quizPrompt = document.getElementById("quizPrompt");
    const quizFeedback = document.getElementById("quizFeedback");
    const btnCerto = document.getElementById("btnCerto");
    const btnErrado = document.getElementById("btnErrado");
    const btnPrevQ = document.getElementById("btnPrevQ");
    const btnNextQ = document.getElementById("btnNextQ");
    const scoreText = document.getElementById("scoreText");
    const btnAction = document.getElementById("btnAction");
    const bar = document.getElementById("bar");
    const txtCasas = document.getElementById("txtCasas");
    const txtPct = document.getElementById("txtPct");

    function render() {
      board.innerHTML = "";
      boardData.forEach(item => {
        const isDone = concluidas.includes(item.id);
        const div = document.createElement("div");
        div.className = `tile ${item.c} ${isDone ? "concluido" : ""}`;
        div.innerHTML = `
          <div class="tile-icon">${item.i}</div>
          <div class="tile-number">${item.id}</div>
          <div class="tile-tag">${item.d}</div>
        `;
        div.onclick = () => openTile(item);
        board.appendChild(div);
      });
      refreshStats();
    }

    function refreshStats() {
      const done = concluidas.length;
      const pct = Math.round((done / boardData.length) * 100);
      bar.style.width = pct + "%";
      txtCasas.innerText = `${done} / ${boardData.length} Casas`;
      txtPct.innerText = `${pct}% Concluído`;
      localStorage.setItem("trilha_tjdft_done", JSON.stringify(concluidas));
    }

    async function openTile(item) {
      currentTile = item;
      currentQIndex = 0;

      if (!item.loaded) {
        try {
          const module = await import(`./casas/casa${item.id}.js`);
          if (module.default && module.default.questions) {
            item.questions = module.default.questions;
            item.loaded = true;
          }
        } catch (e) {
          // Mantém as questões provisórias caso o arquivo da casa não exista
        }
      }

      if (!userAnswers[item.id]) userAnswers[item.id] = {};

      modalNum.innerText = `CASA ${item.id}`;
      modalDisc.innerText = item.d;
      modalIcon.innerText = item.i;
      modalTopic.innerText = `Meta: ${item.t}`;

      const isDone = concluidas.includes(item.id);
      btnAction.innerText = isDone ? "Desmarcar" : "Concluir Casa ✨";
      btnAction.style.background = isDone ? "#dc2626" : "#10b981";

      renderQuestion();
      modal.style.display = "flex";
    }

    function renderQuestion() {
      const q = currentTile.questions[currentQIndex];
      quizCounter.innerText = `Questão ${currentQIndex + 1} de ${currentTile.questions.length}`;
      quizPrompt.innerText = q.q;

      btnCerto.className = "btn-opt btn-opt-certo";
      btnErrado.className = "btn-opt btn-opt-errado";
      quizFeedback.className = "quiz-feedback";

      const answered = userAnswers[currentTile.id][currentQIndex];
      if (answered) {
        showResult(answered);
      }

      updateScore();
    }

    function answer(choice) {
      userAnswers[currentTile.id][currentQIndex] = choice;
      showResult(choice);
      updateScore();
    }

    function showResult(choice) {
      const q = currentTile.questions[currentQIndex];
      const isRight = (choice === q.a);

      btnCerto.className = "btn-opt btn-opt-certo";
      btnErrado.className = "btn-opt btn-opt-errado";

      if (choice === "C") {
        btnCerto.classList.add(isRight ? "btn-correct" : "btn-incorrect");
      } else {
        btnErrado.classList.add(isRight ? "btn-correct" : "btn-incorrect");
      }

      quizFeedback.className = "quiz-feedback show " + (isRight ? "success" : "danger");
      quizFeedback.innerHTML = `<strong>${isRight ? "CORRETO! 🎉" : "INCORRETO! ⚠️"}</strong> (Gabarito: ${q.a === "C" ? "CERTO" : "ERRADO"})<br>${q.exp}`;
    }

    function updateScore() {
      const total = currentTile.questions.length;
      let hits = 0;
      for (let i = 0; i < total; i++) {
        if (userAnswers[currentTile.id][i] === currentTile.questions[i].a) {
          hits++;
        }
      }
      scoreText.innerText = `Desempenho: ${hits}/${total} Acertos`;
    }

    btnPrevQ.onclick = () => {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    };

    btnNextQ.onclick = () => {
      if (currentQIndex < currentTile.questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      }
    };

    btnCerto.onclick = () => answer("C");
    btnErrado.onclick = () => answer("E");

    btnAction.onclick = () => {
      if (concluidas.includes(currentTile.id)) {
        concluidas = concluidas.filter(x => x !== currentTile.id);
      } else {
        concluidas.push(currentTile.id);
      }
      modal.style.display = "none";
      render();
    };

    document.getElementById("btnClose").onclick = () => {
      modal.style.display = "none";
    };

    document.getElementById("btnSalvar").onclick = () => {
      const backup = {
        done: concluidas,
        answers: userAnswers
      };
      const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "trilha_tjdft_backup.json";
      a.click();
    };

    document.getElementById("btnCarregar").onclick = () => {
      document.getElementById("inputUpload").click();
    };

    document.getElementById("inputUpload").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const res = JSON.parse(evt.target.result);
          concluidas = res.done || [];
          userAnswers = res.answers || {};
          render();
        } catch {
          alert("Arquivo corrompido!");
        }
      };
      reader.readAsText(file);
    };

    document.getElementById("btnResetar").onclick = () => {
      if (confirm("Deseja zerar as casas estudadas e respostas?")) {
        concluidas = [];
        userAnswers = {};
        render();
      }
    };

    render();
  </script>
</body>
</html>
